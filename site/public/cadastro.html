<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="Style/css/cadastroCSS.css">
    <link rel="icon" type="image/x-icon" href="Style/assets/smartLogoVetor.ico">
</head>

<body>

    <main>
        <div id="mainContainer">
            <img id="btnIndex" src="Style/assets/home.svg" onclick="backIndex()" alt="">
            <div id="cadastroContainer">
                <h1>Bem-vindo!</h1>
                <p>Faça seu cadastro abaixo, para acessar nossa plataforma.</p>
                <div id="cadastroBox">
                    <div id="cadastroForm">
                        <h1>Cadastro</h1>

                        <div class="grupoInput">
                            <input type="email" id="username" required placeholder=" ">
                            <label for="username">Usuário ou Email</label>
                        </div>

                        <div class="grupoInput">
                            <input type="password" id="senha" required placeholder=" ">
                            <label for="senha">Senha</label>
                            <img class="olho" onclick="exibirSenha()" src="Style/assets/inivisivel.svg">
                        </div>
                        <button onclick="exibirForm()" id="btnLogar">Cadastrar</button>

                        <a id="redLogin" href="login.html">Já possui conta? Faça seu login aqui</a>
                    </div>
                </div>
            </div>

            <div>
                <img id="logo" src="Style/assets/smartLogoVetor.svg" alt="">
            </div>

        </div>
        <div id="formularioCadastro">
            <h1> Preencha as seguintes informações para finzalizar seu cadastro</h1>
            <img id="btnFechar" onclick="fecharForm()" src="Style/assets/xis.svg" alt="">

            <div>

            <div class="grupoInput">
                <input type="text" id="nomeCompleto" required placeholder=" ">
                <label for="nomeCompleto">Nome Completo</label>
            </div>

            <div class="grupoInput">
                <input type="text" id="cpf" required placeholder=" ">
                <label for="cpf">CPF</label>
            </div>
        </div>

        <divv>
            </div>
    </main>


</body>

</html>

<script>
    
    fecharForm = () => {
        const form = document.getElementById('formularioCadastro');
        form.style.display = 'none';
        const background = document.getElementById('mainContainer');
        background.style.filter = 'none';
    };

    exibirSenha = () => {
        const senhaInput = document.getElementById('senha');
        const olhoIcon = document.querySelector('.olho');

        if (senhaInput.type === 'password') {
            senhaInput.type = 'text';
            olhoIcon.src = 'Style/assets/visivel.svg';
        } else {
            senhaInput.type = 'password';
            olhoIcon.src = 'Style/assets/inivisivel.svg';
        }
    };



    backIndex = () => {
        window.location.href = 'index.html';
    };



    exibirForm = () => {
        const form = document.getElementById('formularioCadastro');
        form.style.display = 'flex';
        const background = document.getElementById('mainContainer');
        background.style.filter = 'blur(5px)';

    };

</script>
