        trocarTipo();


        document.addEventListener("DOMContentLoaded", carregarNotificacoes);

        async function carregarNotificacoes() {
            const idUsuario = sessionStorage.ID_USUARIO;

            if (!idUsuario) {
                console.warn("ID_USUARIO não encontrado no sessionStorage.");
                return;
            }

            fetch("/notificacoes/receberNotificacoes", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    idServer: idUsuario,
                })
            })
                .then(async res => {
                    if (!res.ok) throw new Error("Erro ao buscar notificações");
                    // Ler como texto e só parsear JSON se houver conteúdo
                    const text = await res.text();
                    if (!text) return [];
                    try {
                        return JSON.parse(text);
                    } catch (e) {
                        console.warn('Resposta de notificações não é JSON válido:', e);
                        return [];
                    }
                })
                .then(notificacoes => {
                    atualizarDropdown(notificacoes || []);
                })
                .catch(err => console.error(err));
        }

        function deslogar() {
            // ajusta conforme sua rota de logout/login
            sessionStorage.clear();
            window.location.href = 'index.html';
        }

        function atualizarDropdown(notificacoes) {
            var contador = 0;

            const container = document.querySelector(".notificacao-dropdown");
            const badge = document.querySelector(".notification-badge");

            container.innerHTML = "";
            var qtd_not = 0;

            notificacoes.forEach(not => {
                if (not.lido == 0) {
                    qtd_not++;
                }
            });

            if (!badge) {

            } else if (qtd_not <= 0) {
                badge.style.display = 'none';
                badge.textContent = '';
            } else {
                badge.style.display = 'flex';
                badge.textContent = qtd_not > 9 ? '9+' : String(qtd_not);
            }

            notificacoes.forEach(not => {
                if (contador < 3) {
                    const item = document.createElement("div");
                    item.classList.add("notificacao-item");

                    item.innerHTML = `
                        <div class="notificacao-content">
                            <div class="notificacao-title">${not.tipo}</div>
                            <div class="notificacao-text">${not.mensagem}</div>
                            <div class="notificacao-time">${formatarTempo(not.dtNotificacao)}</div>
                        </div>
                    `;

                    container.appendChild(item);
                }
                contador++;
            });

            // Link para ver todas
            const link = document.createElement("a");
            link.href = "notificacoes.html";
            link.textContent = "Ver todas as notificações";
            container.appendChild(link);
        }

        function formatarTempo(dataBanco) {
            const data = new Date(dataBanco);
            const agora = new Date();

            const diffMs = agora - data;
            const diffMin = Math.floor(diffMs / 60000);
            const diffHoras = Math.floor(diffMin / 60);

            if (diffMin < 1) return "Agora mesmo";
            if (diffMin < 60) return `Há ${diffMin} minutos`;
            if (diffHoras < 24) return `Há ${diffHoras} hora${diffHoras > 1 ? "s" : ""}`;

            const diffDias = Math.floor(diffHoras / 24);
            return `Há ${diffDias} dia${diffDias > 1 ? "s" : ""}`;
        }

        let setoresEscolhisdos = [];

        let infoacoes = [];


        async function carregarDados(anos) {
            const resp = await fetch(`/setores/receberSetores/${anos}/${sessionStorage.PERFIL_USUARIO}`);
            const dados = await resp.json();


            setoresEscolhisdos = dados;

            atualizarOpcoesSetor();





        }

        async function carregarAcoesSetor() {
            infoacoes = [];
            todasAcoes = {};

            for (const item of setorSelecionado) {
                const respDados = await fetch(
                    `/setores/buscarAcoesSetor/${item.setor}/${item.quantidade}`
                );

                const dadosSetor = await respDados.json();

                infoacoes.push({
                    setor: item.setor,
                    quantidade: item.quantidade,
                    acoes: dadosSetor
                });

                dadosSetor.forEach(acao => {
                    todasAcoes[acao.ticker] = {
                        nome: `${acao.ticker} - ${acao.nome}`,
                        setor: item.setor
                    };
                });
            }

            atualizarOpcoesAcoes();
        }


        let setorSelecionado = [];


        function atualizarSetoresEscolhidos() {
            const container = document.getElementById('setorEscolhido');
            container.innerHTML = '';

            setorSelecionado.forEach(item => {
                const divTag = document.createElement('div');
                divTag.className = 'tagAcao';
                divTag.innerHTML = `
            ${item.setor} (${item.quantidade})
            <button class="botaoRemover" onclick="removerSetor('${item.setor}')">×</button>
        `;
                container.appendChild(divTag);
            });
        }


        function atualizarOpcoesSetor() {
            const container = document.getElementById('opcaoSetores');
            container.innerHTML = '';

            setoresEscolhisdos.forEach(item => {

                if (!setorSelecionado.some(s => s.setor === item.setor)) {

                    const botao = document.createElement('button');
                    botao.className = 'opcaoAcao';
                    botao.onclick = () => adicionarSetor(item.setor, item.total_acoes_disponiveis);

                    botao.innerHTML = `
                <span class="iconeMais">+</span>
                <span class="nomeAcao">${item.setor}</span>
            `;

                    container.appendChild(botao);
                }
            });
        }



        function adicionarSetor(setor, quantidade) {
            if (setorSelecionado.some(s => s.setor === setor)) return;

            setorSelecionado.push({
                setor,
                quantidade
            });

            atualizarSetoresEscolhidos();
            atualizarOpcoesSetor();
            carregarAcoesSetor();
        }


        function removerSetor(setor) {

            setorSelecionado = setorSelecionado.filter(s => s.setor !== setor);

            Object.keys(todasAcoes).forEach(ticker => {
                if (todasAcoes[ticker].setor === setor) {
                    delete todasAcoes[ticker];
                    acoesEscolhidas = acoesEscolhidas.filter(a => a !== ticker);
                }
            });

            atualizarSetoresEscolhidos();
            atualizarOpcoesSetor();
            atualizarOpcoesAcoes();
        }




        let todasAcoes = {};
        let acoesEscolhidas = [];



        function adicionarAcao(ticker) {
            if (acoesEscolhidas.length >= 4) {
                mensagemErro('Você já selecionou o máximo de 4 ações para comparação');
                return;
            }

            if (acoesEscolhidas.includes(ticker)) {
                return;
            }

            acoesEscolhidas.push(ticker);

            atualizarAcoesEscolhidas();
            atualizarOpcoesAcoes();
            atualizarResultadosComparacao();
        }

        function removerAcao(ticker) {
            acoesEscolhidas = acoesEscolhidas.filter(acao => acao !== ticker);

            atualizarAcoesEscolhidas();
            atualizarOpcoesAcoes();
            atualizarResultadosComparacao();
        }

        function atualizarAcoesEscolhidas() {
            const container = document.getElementById('acoesEscolhidas');
            container.innerHTML = '';

            acoesEscolhidas.forEach(ticker => {
                const divTag = document.createElement('div');
                divTag.className = 'tagAcao';
                divTag.innerHTML = `
            ${todasAcoes[ticker].nome}
            <button class="botaoRemover" onclick="removerAcao('${ticker}')">×</button>
        `;
                container.appendChild(divTag);
            });
        }


        function atualizarOpcoesAcoes() {
            const container = document.getElementById('opcoesAcoes');
            container.innerHTML = '';

            Object.keys(todasAcoes).forEach(ticker => {
                if (!acoesEscolhidas.includes(ticker)) {
                    const botao = document.createElement('button');
                    botao.className = 'opcaoAcao';
                    botao.onclick = () => adicionarAcao(ticker);
                    botao.innerHTML = `
                <span class="iconeMais">+</span>
                <span class="nomeAcao">${todasAcoes[ticker].nome} (${todasAcoes[ticker].setor})</span>
            `;
                    container.appendChild(botao);
                }
            });
        }



        async function atualizarResultadosComparacao() {
            const container = document.getElementById('resultadosComparacao');

            const anos = selectPeriodo.value;

            if (acoesEscolhidas.length === 0) {
                container.innerHTML = '<h2>Selecione ações para comparar</h2>';
                return;
            }

            let infosAcoesTemp = [];
            let evolucaoMeses = [];

            const OBJETO_MES_VAZIO = {
                ticker: "",
                ano: 0,
                mes: 0,
                preco_medio_mes: 0
            };

            for (const item of acoesEscolhidas) {
                try {
                    const respostaMeses = await fetch(`/setores/evolucaoMeses/${item}/${selectPeriodo.value}`);
                    const dadosMeses = await respostaMeses.json();

                    // Se vier vazio → push do objeto padrão
                    evolucaoMeses.push(dadosMeses.length ? dadosMeses : [OBJETO_MES_VAZIO]);
                } catch {
                    evolucaoMeses.push([OBJETO_MES_VAZIO]);
                }
            }

            const OBJETO_ACAO_VAZIO = {
                idEmpresa: 0,
                nome: "",
                ticker: "",
                setor: "",
                logo: "",
                media_preco_fechamento: 0,
                max_preco_alto: 0,
                min_preco_baixo: 0,
                media_volume: 0,
                EBITDA: 0,
                DRE: 0,
                retorno: 0,
                volatilidade_media_ano: 0,
                favoritada: 0
            };


            for (const item of acoesEscolhidas) {
                try {
                    const resposta = await fetch(`/setores/buscarAcoesUnicas/${item}/${anos}/${sessionStorage.ID_USUARIO}`);
                    const dados = await resposta.json();

                    // Se vier vazio → push do objeto padrão
                    infosAcoesTemp.push(dados.length ? dados : [OBJETO_ACAO_VAZIO]);
                } catch {
                    infosAcoesTemp.push([OBJETO_ACAO_VAZIO]);
                }
            }

            console.log(infosAcoesTemp);
            console.log(evolucaoMeses);



            let html = '<h2>Comparação de Indicadores</h2>';
            html += '<div class="containerCards">';


            infosAcoesTemp.forEach(ticker => {

                html += `

                        <div class="cabecalhoCard">

                            <span class="tagSetor">${ticker[0].setor}</span>
                        </div>
                        <div class="indicadores">
                            <div class="grupoIndicador">
                                <div class="nomeIndicador">
                                    <span class="tooltip left-edge">
                                            Retorno <span class="tip">É o lucro ou prejuízo percentual do investimento em determinado período.</span>
                                        </span></div>
                                <div class="valorIndicador positivo">${ticker[0].retorno}%</div>
                            </div>
                            <div class="grupoIndicador">
                                <div class="nomeIndicador"><span class="tooltip left-edge">
                                            Volatilidade

                                        </span></div>
                                <div class="valorIndicador neutro">${ticker[0].volatilidade_media_ano}%</div>
                            </div>
                            <div class="grupoIndicador">
                                <div class="nomeIndicador"><span class="tooltip left-edge">
                                            DRE<span class="tip">Lucro Líquido médio das empresas do setor.</span>
                                        </span></div>
                                <div class="valorIndicador negativo">R$${ticker[0].DRE}M</div>
                            </div>
                            <div class="grupoIndicador">
                                <div class="nomeIndicador"><span class="tooltip left-edge">
                                            EBITDA<span class="tip">Potencial de geração de caixa operacional (Lucro antes de juros/impostos).</span>
                                        </span></div>
                                <div class="valorIndicador negativo">R$${ticker[0].EBITDA}M</div>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += '</div>';

            html += '<div class="containerGraficos">';

            html += '</div>';

            html += '<div class="containerGraficos">';
            html += `
                <div class="secaoGrafico">
                    <h3>EBITDA e DRE</h3>
                    <div class="grafico">
                        <canvas id="graficoRetornoEPE"></canvas>

            `;
            html += `
                <div class="secaoGrafico">
                    <h3>Retorno e Volatilidade</h3>
                    <div class="grafico">
                        <canvas id="graficoSharpeBeta"></canvas>
                    </div>

            `;
            html += '</div>';

            html += '<div class="containerGraficos">';
            html += `
                <div class="secaoGrafico">
                    <h3>Evolução de Preços</h3>

            html += '</div>';

            html += `

        const cores = {
            '0': 'rgb(54, 162, 235)',
            '1': 'rgb(75, 192, 192)',
            '2': 'rgb(255, 99, 132)',
            '3': 'rgb(255, 159, 64)',

        };


        function criarGraficoBarras(acoes) {
            const ctxRetornoEPE = document.getElementById('graficoRetornoEPE');


            const dadosRetornoEPE = {
                labels: ['EBITDA(R$M)', 'DRE(R$M)'],
                datasets: []
            };

            const ctxSharpeBeta = document.getElementById('graficoSharpeBeta');
            const dadosSharpeBeta = {
                labels: ['Retorno(%)', 'Volatilidade(%) '],
                datasets: []
            };


            var cor = 0

            acoes.forEach(ticker => {


                dadosRetornoEPE.datasets.push({
                    label: ticker[0].ticker,
                    data: [ticker[0].EBITDA, ticker[0].DRE],
                    backgroundColor: cores[cor],
                    borderColor: 'rgba(0,0,0,0.1)',
                    borderWidth: 1
                });

                dadosSharpeBeta.datasets.push({
                    label: ticker[0].ticker,
                    data: [ticker[0].retorno, ticker[0].volatilidade_media_ano],
                    backgroundColor: cores[cor],
                    borderColor: 'rgba(0,0,0,0.1)',
                    borderWidth: 1
                });

                cor++;
            });

            const opcoes = {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: {
                            color: 'rgba(0,0,0,0.05)'
                        }
                    },
                    x: {
                        grid: {
                            display: false
                        }
                    }
                },
                plugins: {
                    legend: {
                        position: 'bottom'
                    }
                },
                barPercentage: 0.7
            };

            new Chart(ctxRetornoEPE, {
                type: 'bar',
                data: dadosRetornoEPE,
                options: opcoes
            });

            new Chart(ctxSharpeBeta, {
                type: 'bar',
                data: dadosSharpeBeta,
                options: opcoes
            });
        }

        function criarGraficoEvolucaoPrecos(evolucaoMeses) {
            const ctx = document.getElementById('graficoEvolucaoPrecos');

            const meses = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];







            var cor = 0;
            const datasets = [];

            evolucaoMeses.forEach(ticker => {

                var precos = [];

                ticker.forEach(element => {
                    precos.push(element.preco_medio_mes)
                });

                datasets.push({
                    label: ticker[0].ticker,
                    data: precos,
                    borderColor: cores[cor],
                    backgroundColor: cores[cor],
                    borderWidth: 2,
                    tension: 0.3,
                    pointRadius: 3
                });
                cor++;
            });


            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: meses,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: {
                                color: 'rgba(0,0,0,0.05)'
                            }
                        },
                        x: {
                            grid: {
                                color: 'rgba(0,0,0,0.05)'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });
        }

        document.querySelector('#notificacaoIcon').addEventListener('click', function (e) {
            e.stopPropagation();
            const dropdown = document.querySelector('.notificacao-dropdown');
            dropdown.classList.toggle('active');
        });

        document.addEventListener('click', function (e) {
            const dropdown = document.querySelector('.notificacao-dropdown');
            // corrige seletor (classe no HTML é "notification-container")
            if (!e.target.closest('.notification-container')) {
                dropdown.classList.remove('active');
            }
        });


        (function () {
            const perfil = document.querySelector('#perfilIcon');
            const opcoes = document.querySelector('.opcoes-dropdown');

            if (!perfil || !opcoes) return;

            function abrirFecharPerfil() {
                const ativo = opcoes.classList.toggle('active');
                opcoes.setAttribute('aria-hidden', (!ativo).toString());
                perfil.setAttribute('aria-expanded', ativo.toString());
            }

            perfil.addEventListener('click', function (ev) {
                ev.stopPropagation();
                abrirFecharPerfil();
            });

            perfil.addEventListener('keydown', function (ev) {
                if (ev.key === 'Enter' || ev.key === ' ') {
                    ev.preventDefault();
                    abrirFecharPerfil();
                }
            });

            document.addEventListener('click', function (ev) {
                if (!ev.target.closest('#perfilIcon') && !ev.target.closest('.opcoes-dropdown')) {
                    opcoes.classList.remove('active');
                    opcoes.setAttribute('aria-hidden', 'true');
                    perfil.setAttribute('aria-expanded', 'false');
                }
            });
        })();


    </script>

</body>
