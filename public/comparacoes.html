<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparações</title>
    <link rel="icon" type="image/x-icon" href="Style/assets/smartLogoVetor.ico">
    <link rel="stylesheet" href="Style/css/comparacoesCSS.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div id="mainContainer">
        <div class="container">
            <div id="header">
                <img id="logo" src="Style/assets/smartLogoVetor.svg" alt="logoSmartInvestment">
                <div class="navbar">
                    <a href="dashboard.html">Dashboard</a>
                    <a href="setores.html">Setores</a>
                    <a href="acoes.html">Ações</a>
                    <a href="comparacoes.html" class="selected">Comparações</a>
                    <a href="perfil.html">Perfil</a>
                </div>

                <div class="notification-container">
                    <span class="notification-badge"></span>
                    <img id="notificacaoIcon" src="Style/assets/sinoNotificacao.svg" alt="">
                    <div class="notificacao-dropdown">
                    </div>
                </div>
                <img onclick="sair()" id="perfilIcon" class="perfilBoneco" src="Style/assets/perfilBoneco.svg" alt="">

                <div class="hamburger">
                    <div class="bar1"></div>
                    <div class="bar2"></div>
                    <div class="bar3"></div>
                </div>
                <nav class="mobile-menu">
                    <a href="dashboard.html">Dashboard</a>
                    <a href="setores.html">Setores</a>
                    <a href="acoes.html">Ações</a>
                    <a href="comparacoes.html">Comparações</a>
                    <a href="perfil.html">Perfil</a>
                </nav>

            </div>

            <div id="conteudo">
                <div class="containerTitulo">
                    <h1>Comparações</h1>
                    <select id="selecionarTipo">
                        <option value="acoes">Ações</option>
                        <option value="fundos">Fundos Imobiliários</option>
                        <option value="criptomoedas">Criptomoedas</option>
                    </select>
                </div>

                <div class="secao">
                    <p class="instrucaoSelecao">Selecione até 4 itens para comparar</p>

                    <div class="acoesEscolhidas" id="acoesEscolhidas">

                    </div>

                    <div class="opcoesAcoes" id="opcoesAcoes">

                    </div>
                </div>

                <div id="resultadosComparacao">
                    <h2>Comparação de Indicadores</h2>
                </div>
            </div>
        </div>
    </div>

    <script>
       document.addEventListener("DOMContentLoaded", carregarNotificacoes);

  async function carregarNotificacoes() {
    const idUsuario = sessionStorage.ID_USUARIO;

    if (!idUsuario) {
      console.warn("ID_USUARIO não encontrado no sessionStorage.");
      return;
    }

        fetch("/notificacoes/receberNotificacoes", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                idServer: idUsuario,
            })
        })
            .then(async res => {
                if (!res.ok) throw new Error("Erro ao buscar notificações");
                // Ler como texto e só parsear JSON se houver conteúdo
                const text = await res.text();
                if (!text) return [];
                try {
                    return JSON.parse(text);
                } catch (e) {
                    console.warn('Resposta de notificações não é JSON válido:', e);
                    return [];
                }
            })
            .then(notificacoes => {
                atualizarDropdown(notificacoes || []);
            })
            .catch(err => console.error(err));
  }

  function atualizarDropdown(notificacoes) {
    var contador = 0;

    const container = document.querySelector(".notificacao-dropdown");
    const badge = document.querySelector(".notification-badge");

    // Limpa o container (evita duplicar)
    container.innerHTML = "";
    var qtd_not = 0;

    notificacoes.forEach(not => {
      if (not.lido == 0) {
        qtd_not++;
      }
    });

        // Atualiza badge (mostra no máx. 9+). Se não houver notificações, oculta o badge.
        if (!badge) {
            // elemento não encontrado — nada a fazer
        } else if (qtd_not <= 0) {
            badge.style.display = 'none';
            badge.textContent = '';
        } else {
            badge.style.display = 'flex';
            badge.textContent = qtd_not > 9 ? '9+' : String(qtd_not);
        }

    notificacoes.forEach(not => {
      if (contador < 3) {
        const item = document.createElement("div");
        item.classList.add("notificacao-item");

        item.innerHTML = `
                        <div class="notificacao-content">
                            <div class="notificacao-title">${not.tipo}</div>
                            <div class="notificacao-text">${not.mensagem}</div>
                            <div class="notificacao-time">${formatarTempo(not.dtNotificacao)}</div>
                        </div>
                    `;

        container.appendChild(item);
        console.log(not.tipo)
      }
      contador++;
    });

    // Link para ver todas
    const link = document.createElement("a");
    link.href = "notificacoes.html";
    link.textContent = "Ver todas as notificações";
    container.appendChild(link);
  }

        function formatarTempo(dataBanco) {
            const data = new Date(dataBanco);
            const agora = new Date();

            const diffMs = agora - data;
            const diffMin = Math.floor(diffMs / 60000);
            const diffHoras = Math.floor(diffMin / 60);

            if (diffMin < 1) return "Agora mesmo";
            if (diffMin < 60) return `Há ${diffMin} minutos`;
            if (diffHoras < 24) return `Há ${diffHoras} hora${diffHoras > 1 ? "s" : ""}`;

            const diffDias = Math.floor(diffHoras / 24);
            return `Há ${diffDias} dia${diffDias > 1 ? "s" : ""}`;
        }

        const todasAcoes = {
            'AAPL': { nome: 'AAPL - Apple', setor: 'Tecnologia' },
            'MSFT': { nome: 'MSFT - Microsoft', setor: 'Tecnologia' },
            'GOOGL': { nome: 'GOOGL - Alphabet', setor: 'Tecnologia' },
            'TSLA': { nome: 'TSLA - Tesla', setor: 'Automotivo' },
            'JNJ': { nome: 'JNJ - Johnson & Johnson', setor: 'Saúde' },
            'JPM': { nome: 'JPM - JPMorgan', setor: 'Financeiro' }
        };

        let acoesEscolhidas = ['AAPL', 'MSFT'];

        document.addEventListener('DOMContentLoaded', function () {
            atualizarAcoesEscolhidas();
            atualizarOpcoesAcoes();
            atualizarResultadosComparacao();
        });

        function adicionarAcao(ticker) {
            if (acoesEscolhidas.length >= 4) {
                alert('Você já selecionou o máximo de 4 ações para comparação');
                return;
            }

            if (acoesEscolhidas.includes(ticker)) {
                return;
            }

            acoesEscolhidas.push(ticker);

            atualizarAcoesEscolhidas();
            atualizarOpcoesAcoes();
            atualizarResultadosComparacao();
        }

        function removerAcao(ticker) {
            acoesEscolhidas = acoesEscolhidas.filter(acao => acao !== ticker);

            atualizarAcoesEscolhidas();
            atualizarOpcoesAcoes();
            atualizarResultadosComparacao();
        }

        function atualizarAcoesEscolhidas() {
            const container = document.getElementById('acoesEscolhidas');
            container.innerHTML = '';

            acoesEscolhidas.forEach(ticker => {
                const divTag = document.createElement('div');
                divTag.className = 'tagAcao';
                divTag.innerHTML = `
                    ${ticker}
                    <button class="botaoRemover" onclick="removerAcao('${ticker}')">×</button>
                `;
                container.appendChild(divTag);
            });
        }

        function atualizarOpcoesAcoes() {
            const container = document.getElementById('opcoesAcoes');
            container.innerHTML = '';

            Object.keys(todasAcoes).forEach(ticker => {
                if (!acoesEscolhidas.includes(ticker)) {
                    const botao = document.createElement('button');
                    botao.className = 'opcaoAcao';
                    botao.onclick = function () { adicionarAcao(ticker); };
                    botao.innerHTML = `
                        <span class="iconeMais">+</span>
                        <span class="nomeAcao">${todasAcoes[ticker].nome}</span>
                    `;
                    container.appendChild(botao);
                }
            });
        }

        function atualizarResultadosComparacao() {
            const container = document.getElementById('resultadosComparacao');

            if (acoesEscolhidas.length === 0) {
                container.innerHTML = '<h2>Selecione ações para comparar</h2>';
                return;
            }

            let html = '<h2>Comparação de Indicadores</h2>';
            html += '<div class="containerCards">';

            const dadosAcoes = {
                'AAPL': {
                    retornoValor: '+22',
                    retornoPercent: '.5%',
                    volatilidade: '25.3',
                    volatPorcent: '%',
                    maxDrawdownValor: '-15',
                    maxDrawdownPercent: '.2%'
                },
                'MSFT': {
                    retornoValor: '+19',
                    retornoPercent: '.8%',
                    volatilidade: '23.1',
                    volatPorcent: '%',
                    maxDrawdownValor: '-12',
                    maxDrawdownPercent: '.8%'
                },
                'GOOGL': {
                    retornoValor: '+15',
                    retornoPercent: '.3%',
                    volatilidade: '28.7',
                    volatPorcent: '%',
                    maxDrawdownValor: '-18',
                    maxDrawdownPercent: '.5%'
                },
                'TSLA': {
                    retornoValor: '+31',
                    retornoPercent: '.2%',
                    volatilidade: '45.6',
                    volatPorcent: '%',
                    maxDrawdownValor: '-35',
                    maxDrawdownPercent: '.7%'
                },
                'JNJ': {
                    retornoValor: '+8',
                    retornoPercent: '.1%',
                    volatilidade: '15.2',
                    volatPorcent: '%',
                    maxDrawdownValor: '-7',
                    maxDrawdownPercent: '.4%'
                },
                'JPM': {
                    retornoValor: '+17',
                    retornoPercent: '.9%',
                    volatilidade: '21.4',
                    volatPorcent: '%',
                    maxDrawdownValor: '-14',
                    maxDrawdownPercent: '.3%'
                }
            };

            acoesEscolhidas.forEach(ticker => {
                const dados = dadosAcoes[ticker];

                html += `
                    <div class="cardAcao">
                        <div class="cabecalhoCard">
                            <h3>${ticker}</h3>
                            <span class="tagSetor">${todasAcoes[ticker].setor}</span>
                        </div>
                        <div class="indicadores">
                            <div class="grupoIndicador">
                                <div class="nomeIndicador">
                                    <span class="tooltip left-edge">
                                            Retorno <span class="tip">É o lucro ou prejuízo percentual do investimento em determinado período.</span>
                                        </span></div>
                                <div class="valorIndicador positivo">${dados.retornoValor}</div>
                                <div class="percentualIndicador positivo">${dados.retornoPercent}</div>
                            </div>
                            <div class="grupoIndicador">
                                <div class="nomeIndicador"><span class="tooltip left-edge">
                                            Volatilidade
                                            <span class="tip">Mostra o quanto o preço oscila ao longo do tempo.</span>
                                        </span></div>
                                <div class="valorIndicador neutro">${dados.volatilidade}</div>
                                <div class="percentualIndicador neutro">${dados.volatPorcent}</div>
                            </div>
                            <div class="grupoIndicador">
                                <div class="nomeIndicador"><span class="tooltip left-edge">
                                            Max Drawdown <span class="tip">É a maior perda desde o ponto mais alto até o mais baixo do investimento.</span>
                                        </span></div>
                                <div class="valorIndicador negativo">${dados.maxDrawdownValor}</div>
                                <div class="percentualIndicador negativo">${dados.maxDrawdownPercent}</div>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += '</div>';

            html += '<div class="containerGraficos">';
            html += `
                <div class="secaoGrafico">
                    <h3>Análise Multidimensional</h3>
                    <div class="grafico">
                        <canvas id="graficoRadar"></canvas>
                    </div>
                </div>
            `;
            html += '</div>';

            html += '<div class="containerGraficos">';
            html += `
                <div class="secaoGrafico">
                    <h3>Retorno e P/E</h3>
                    <div class="grafico">
                        <canvas id="graficoRetornoEPE"></canvas>
                    </div>
                </div>
            `;
            html += `
                <div class="secaoGrafico">
                    <h3>Sharpe e Beta</h3>
                    <div class="grafico">
                        <canvas id="graficoSharpeBeta"></canvas>
                    </div>
                </div>
            `;
            html += '</div>';

            html += '<div class="containerGraficos">';
            html += `
                <div class="secaoGrafico">
                    <h3>Evolução de Preços</h3>
                    <div class="grafico">
                        <canvas id="graficoEvolucaoPrecos"></canvas>
                    </div>
                </div>
            `;
            html += '</div>';

            html += `
                <div class="secaoGrafico resumoComparativo">
                    <h3>Resumo Comparativo</h3>
                    <table class="tabelaResumo">
                        <thead>
                            <tr>
                                <th>Métrica</th>
                                ${acoesEscolhidas.map(ticker => `<th>${ticker}</th>`).join('')}
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Retorno (%)</td>
                                ${acoesEscolhidas.map(ticker => `
                                    <td>
                                        <span class="valorPositivo">${dadosAcoes[ticker].retornoValor}</span>
                                        <span class="percentualPositivo">${dadosAcoes[ticker].retornoPercent}</span>
                                    </td>
                                `).join('')}
                            </tr>
                            <tr>
                                <td>Volatilidade (%)</td>
                                ${acoesEscolhidas.map(ticker => `
                                    <td>
                                        <span class="valorNeutro">${dadosAcoes[ticker].volatilidade}</span>
                                        <span class="percentualNeutro">${dadosAcoes[ticker].volatPorcent}</span>
                                    </td>
                                `).join('')}
                            </tr>
                            <tr>
                                <td>Max Drawdown (%)</td>
                                ${acoesEscolhidas.map(ticker => `
                                    <td>
                                        <span class="valorNegativo">${dadosAcoes[ticker].maxDrawdownValor}</span>
                                        <span class="percentualNegativo">${dadosAcoes[ticker].maxDrawdownPercent}</span>
                                    </td>
                                `).join('')}
                            </tr>
                        </tbody>
                    </table>
                </div>
            `;

            container.innerHTML = html;

            if (acoesEscolhidas.length >= 1) {
                criarGraficoRadar();
                criarGraficoBarras();
                criarGraficoEvolucaoPrecos();
            }
        }

        function criarGraficoRadar() {
            const ctx = document.getElementById('graficoRadar');

            const dados = {
                labels: ['Retorno', 'Sharpe', 'Liquidez', 'Estabilidade'],
                datasets: []
            };

            const cores = {
                'AAPL': {
                    background: 'rgba(54, 162, 235, 0.2)',
                    border: 'rgb(54, 162, 235)'
                },
                'MSFT': {
                    background: 'rgba(75, 192, 192, 0.2)',
                    border: 'rgb(75, 192, 192)'
                },
                'GOOGL': {
                    background: 'rgba(255, 99, 132, 0.2)',
                    border: 'rgb(255, 99, 132)'
                },
                'TSLA': {
                    background: 'rgba(255, 159, 64, 0.2)',
                    border: 'rgb(255, 159, 64)'
                },
                'JNJ': {
                    background: 'rgba(153, 102, 255, 0.2)',
                    border: 'rgb(153, 102, 255)'
                },
                'JPM': {
                    background: 'rgba(255, 205, 86, 0.2)',
                    border: 'rgb(255, 205, 86)'
                }
            };

            const dadosRadar = {
                'AAPL': [7.5, 6.8, 6.5, 7.0],
                'MSFT': [8.2, 7.5, 7.8, 7.6],
                'GOOGL': [7.8, 7.2, 6.9, 7.4],
                'TSLA': [8.5, 6.0, 5.5, 5.8],
                'JNJ': [6.8, 7.8, 8.2, 8.5],
                'JPM': [7.2, 7.0, 7.8, 7.5]
            };

            acoesEscolhidas.forEach(ticker => {
                dados.datasets.push({
                    label: ticker,
                    data: dadosRadar[ticker],
                    fill: true,
                    backgroundColor: cores[ticker].background,
                    borderColor: cores[ticker].border,
                    pointBackgroundColor: cores[ticker].border,
                    pointBorderColor: '#fff',
                    pointHoverBackgroundColor: '#fff',
                    pointHoverBorderColor: cores[ticker].border
                });
            });

            new Chart(ctx, {
                type: 'radar',
                data: dados,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        r: {
                            angleLines: {
                                display: true,
                                color: 'rgba(0,0,0,0.1)'
                            },
                            ticks: {
                                beginAtZero: true,
                                max: 10,
                                stepSize: 2
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });
        }

        function criarGraficoBarras() {
            const ctxRetornoEPE = document.getElementById('graficoRetornoEPE');
            const dadosRetornoEPE = {
                labels: ['Retorno (%)', 'P/E'],
                datasets: []
            };

            const ctxSharpeBeta = document.getElementById('graficoSharpeBeta');
            const dadosSharpeBeta = {
                labels: ['Sharpe', 'Beta'],
                datasets: []
            };

            const cores = {
                'AAPL': 'rgb(54, 162, 235)',
                'MSFT': 'rgb(75, 192, 192)',
                'GOOGL': 'rgb(255, 99, 132)',
                'TSLA': 'rgb(255, 159, 64)',
                'JNJ': 'rgb(153, 102, 255)',
                'JPM': 'rgb(255, 205, 86)'
            };

            const dadosBarras = {
                'AAPL': [22.5, 1.2, 1.1, 28.3],
                'MSFT': [19.8, 1.1, 0.9, 35.2],
                'GOOGL': [15.3, 0.9, 1.3, 24.1],
                'TSLA': [31.2, 0.7, 1.7, 42.5],
                'JNJ': [8.1, 1.4, 0.6, 18.9],
                'JPM': [17.9, 1.0, 1.2, 22.7]
            };

            acoesEscolhidas.forEach(ticker => {
                dadosRetornoEPE.datasets.push({
                    label: ticker,
                    data: [dadosBarras[ticker][0], dadosBarras[ticker][3]],
                    backgroundColor: cores[ticker],
                    borderColor: 'rgba(0,0,0,0.1)',
                    borderWidth: 1
                });

                dadosSharpeBeta.datasets.push({
                    label: ticker,
                    data: [dadosBarras[ticker][1], dadosBarras[ticker][2]],
                    backgroundColor: cores[ticker],
                    borderColor: 'rgba(0,0,0,0.1)',
                    borderWidth: 1
                });
            });

            const opcoes = {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: {
                            color: 'rgba(0,0,0,0.05)'
                        }
                    },
                    x: {
                        grid: {
                            display: false
                        }
                    }
                },
                plugins: {
                    legend: {
                        position: 'bottom'
                    }
                },
                barPercentage: 0.7
            };

            new Chart(ctxRetornoEPE, {
                type: 'bar',
                data: dadosRetornoEPE,
                options: opcoes
            });

            new Chart(ctxSharpeBeta, {
                type: 'bar',
                data: dadosSharpeBeta,
                options: opcoes
            });
        }

        function criarGraficoEvolucaoPrecos() {
            const ctx = document.getElementById('graficoEvolucaoPrecos');

            const meses = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];

            const precosPorAcao = {
                'AAPL': [178, 179, 180, 181, 182, 183, 184, 185, 186, 187, 188, 189],
                'MSFT': [287, 289, 293, 297, 302, 305, 310, 312, 315, 318, 320, 325],
                'GOOGL': [155, 158, 160, 163, 167, 170, 173, 175, 178, 180, 183, 186],
                'TSLA': [380, 390, 385, 405, 420, 410, 440, 450, 445, 460, 470, 485],
                'JNJ': [155, 157, 159, 160, 162, 163, 165, 166, 168, 169, 171, 172],
                'JPM': [145, 148, 150, 152, 154, 156, 158, 160, 162, 164, 166, 168]
            };

            const cores = {
                'AAPL': 'rgb(54, 162, 235)',
                'MSFT': 'rgb(75, 192, 192)',
                'GOOGL': 'rgb(255, 99, 132)',
                'TSLA': 'rgb(255, 159, 64)',
                'JNJ': 'rgb(153, 102, 255)',
                'JPM': 'rgb(255, 205, 86)'
            };

            const datasets = [];

            acoesEscolhidas.forEach(ticker => {
                datasets.push({
                    label: ticker,
                    data: precosPorAcao[ticker],
                    borderColor: cores[ticker],
                    backgroundColor: cores[ticker],
                    borderWidth: 2,
                    tension: 0.3,
                    pointRadius: 3
                });
            });

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: meses,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: {
                                color: 'rgba(0,0,0,0.05)'
                            }
                        },
                        x: {
                            grid: {
                                color: 'rgba(0,0,0,0.05)'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });
        }

        document.querySelector('#notificacaoIcon').addEventListener('click', function (e) {
            e.stopPropagation();
            const dropdown = document.querySelector('.notificacao-dropdown');
            dropdown.classList.toggle('active');
        });

        document.addEventListener('click', function (e) {
            const dropdown = document.querySelector('.notificacao-dropdown');
            if (!e.target.closest('.notificacao-container')) {
                dropdown.classList.remove('active');
            }
        });
    </script>
</body>

</html>
