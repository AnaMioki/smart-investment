<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifição</title>
    <link rel="icon" type="image/x-icon" href="Style/assets/smartLogoVetor.ico">
    <link rel="stylesheet" href="Style/css/notificacoesCSS.css">
</head>

<body>
    <div id="mainContainer">
        <div id="header">
            <img id="logo" src="Style/assets/smartLogoVetor.svg" alt="logoSmartInvestment">
            <div class="navbar">
                <a href="dashboard.html">Dashboard</a>
                <a href="setores.html">Setores</a>
                <a href="acoes.html">Ações</a>
                <a href="comparacoes.html">Comparações</a>
                <a href="perfil.html">Perfil</a>
            </div>

            <div class="notification-container">
                <span class="notification-badge"></span>
                <img id="notificacaoIcon" src="Style/assets/sinoNotificacao.svg" alt="">
                <div class="notificacao-dropdown">
                </div>
            </div>
               <img id="perfilIcon" class="perfilBoneco" src="Style/assets/perfilBoneco.svg" alt="Perfil" role="button"
                    tabindex="0" aria-haspopup="true" aria-expanded="false">
                <div class="opcoes-dropdown" role="menu" aria-hidden="true">
                    <a role="menuitem" href="perfil.html">Perfil</a>
                    <a role="menuitem" href="#" onclick="sair()">Sair</a>
                </div>

            <div class="hamburger">
                <div class="bar1"></div>
                <div class="bar2"></div>
                <div class="bar3"></div>
            </div>
            <nav class="mobile-menu">
                <a href="dashboard.html">Dashboard</a>
                <a href="setores.html">Setores</a>
                <a href="acoes.html">Ações</a>
                <a href="comparacoes.html">Comparações</a>
                <a href="perfil.html">Perfil</a>
            </nav>

        </div>

        <div id="mainNotification">
            <div id="mainExp">
                <div id="topNotification">
                    <div>
                        <h1>Notificações</h1>
                        <p>Acompanhe alertas e oportunidades do mercado</p>
                    </div>
                    <h2 id="notNovas">0 novas</h2>
                </div>

                <div id="selectNotification">
                    <div>
                        <p onclick="carregarTodas()" class="selected" id="btnTodas">Todas</p>
                        <p onclick="carregarNaoLidas()" id="btnNaoLidas">Não lidas</p>
                    </div>
                </div>

                <div id="listNotificacoes"></div>

            </div>
        </div>
    </div>
</body>

</html>
<script>
    document.addEventListener("DOMContentLoaded", carregarNotificacoes);

    function carregarNotificacoes() {
        const idUsuario = sessionStorage.ID_USUARIO;

        if (!idUsuario) {
            console.warn("ID_USUARIO não encontrado no sessionStorage.");
            return;
        }

        fetch("/notificacoes/receberNotificacoes", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                idServer: idUsuario,
            })
        })
            .then(res => {
                if (!res.ok) throw new Error("Erro ao buscar notificações");
                return res.json();
            })
            .then(notificacoes => {
                atualizarDropdown(notificacoes);
            })
            .catch(err => console.error(err));
    }

    function atualizarDropdown(notificacoes) {
        var contador = 0;

        const container = document.querySelector(".notificacao-dropdown");
        const badge = document.querySelector(".notification-badge");

        // Limpa o container (evita duplicar)
        container.innerHTML = "";
        var qtd_not = 0;

        notificacoes.forEach(not => {
            if (not.lido == 0) {
                qtd_not++;
            }
        });

        // Atualiza badge (mostra no máx. 9+)
        badge.textContent = qtd_not > 9 ? "9+" : qtd_not;

        notificacoes.forEach(not => {
            if (contador < 3) {
                const item = document.createElement("div");
                item.classList.add("notificacao-item");

                item.innerHTML = `
                        <div class="notificacao-content">
                            <div class="notificacao-title">${not.tipo}</div>
                            <div class="notificacao-text">${not.mensagem}</div>
                            <div class="notificacao-time">${formatarTempo(not.dtNotificacao)}</div>
                        </div>
                    `;

                container.appendChild(item);
                console.log(not.tipo)
            }
            contador++;
        });

        // Link para ver todas
        const link = document.createElement("a");
        link.href = "notificacoes.html";
        link.textContent = "Ver todas as notificações";
        container.appendChild(link);
    }

    function formatarTempo(dataBanco) {
        const data = new Date(dataBanco);
        const agora = new Date();

        const diffMs = agora - data;
        const diffMin = Math.floor(diffMs / 60000);
        const diffHoras = Math.floor(diffMin / 60);

        if (diffMin < 1) return "Agora mesmo";
        if (diffMin < 60) return `Há ${diffMin} minutos`;
        if (diffHoras < 24) return `Há ${diffHoras} hora${diffHoras > 1 ? "s" : ""}`;

        const diffDias = Math.floor(diffHoras / 24);
        return `Há ${diffDias} dia${diffDias > 1 ? "s" : ""}`;
    }

    document.querySelector('#notificacaoIcon').addEventListener('click', function (e) {
        e.stopPropagation();
        const dropdown = document.querySelector('.notificacao-dropdown');
        dropdown.classList.toggle('active');
    });

    document.addEventListener('click', function (e) {
        const dropdown = document.querySelector('.notificacao-dropdown');
        if (!e.target.closest('.notificacao-container')) {
            dropdown.classList.remove('active');
        }
    });

    document.addEventListener("DOMContentLoaded", () => {
        carregarContador();
        carregarTodas();
    });

    /* ===========================
        CONTADOR "X novas"
    =========================== */
    function carregarContador() {
        const idUsuario = sessionStorage.ID_USUARIO;

        fetch("/notificacoes/receberNotCount", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ idServer: idUsuario })
        })
            .then(res => res.json())
            .then(data => {
                document.getElementById("notNovas").innerText = `${data.idUsuario} novas`;
            })
            .catch(err => console.error(err));
    }

    /* ===========================
        BOTÃO → TODAS AS NOTIFICAÇÕES
    =========================== */
    function carregarTodas() {
        ativarBotao("todas");

        const idUsuario = sessionStorage.ID_USUARIO;

        fetch("/notificacoes/receberNotificacoes", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ idServer: idUsuario })
        })
            .then(res => res.json())
            .then(data => {
                montarLista(data);
            })
            .catch(err => console.error(err));
    }

    /* ===========================
        BOTÃO → NÃO LIDAS
    =========================== */
    function carregarNaoLidas() {
        ativarBotao("naolidas");

        const idUsuario = sessionStorage.ID_USUARIO;

        fetch("/notificacoes/receberNotificacoesNaoLida", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ idServer: idUsuario })
        })
            .then(res => {
                if (res.status === 204) {
                    console.warn("Nenhuma notificação encontrada.");
                    return []; // devolve array vazio
                }
                if (!res.ok) {
                    throw new Error("Erro ao buscar notificações");
                }
                return res.json(); // só chama json quando há JSON
            })
            .then(notificacoes => {
                montarLista(notificacoes);
            })
            .catch(err => console.error(err));
    }

    /* ===========================
        ALTERA ESTILO DO BOTÃO
    =========================== */
    function ativarBotao(tipo) {
        const btnTodas = document.getElementById("btnTodas");
        const btnNao = document.getElementById("btnNaoLidas");

        if (tipo === "todas") {
            btnTodas.classList.add("selected");
            btnNao.classList.remove("selected");
        } else {
            btnNao.classList.add("selected");
            btnTodas.classList.remove("selected");
        }
    }

    /* ===========================
        MONTA TODA A LISTA DINAMICAMENTE
    =========================== */
    function montarLista(notificacoes) {
        const container = document.getElementById("listNotificacoes");

        container.innerHTML = `
        <p><span>${notificacoes.length}</span> notificações no total</p>
        <div class="setorLista"></div>
    `;

        const lista = container.querySelector(".setorLista");

        notificacoes.forEach(n => {
            const div = document.createElement("div");

            const icon = n.tipo.toLowerCase() === "alerta"
                ? "Style/assets/alertaNotificação.svg"
                : "Style/assets/setaParaCimaNotificacao.svg";

            div.innerHTML = `
            <div>
                <img src="${icon}" class="${n.tipo === "alerta" ? "alerta" : "informacao"}">
                <div>
                    <h1>${n.tipo}</h1>
                    <p>${n.mensagem}</p>
                    <h2>${formatarTempo(n.dtNotificacao)}</h2>
                </div>
            </div>
            ${n.lido == 0 ? `<div class="newNotify"></div>` : ``}
        `;

            lista.appendChild(div);
        });
    }

    /* ===========================
        TEMPO RELATIVO
    =========================== */
    function formatarTempo(dataBanco) {
        const data = new Date(dataBanco);
        const agora = new Date();
        const diff = agora - data;

        const min = Math.floor(diff / 60000);
        const hr = Math.floor(min / 60);
        const dia = Math.floor(hr / 24);

        if (min < 1) return "Agora mesmo";
        if (min < 60) return `Há ${min} min`;
        if (hr < 24) return `Há ${hr} hora${hr > 1 ? "s" : ""}`;
        return dia === 1 ? "Ontem" : `Há ${dia} dias`;
    }

    window.addEventListener("unload", () => {
        const idUsuario = sessionStorage.ID_USUARIO;

        const data = JSON.stringify({ idServer: idUsuario });

        navigator.sendBeacon(
            "/notificacoes/atualizarNotificoesNaoLidas",
            new Blob([data], { type: "application/json" })
        );
    });

    
    (function () {
        const perfil = document.querySelector('#perfilIcon');
        const opcoes = document.querySelector('.opcoes-dropdown');

        if (!perfil || !opcoes) return;

        function abrirFecharPerfil() {
            const ativo = opcoes.classList.toggle('active');
            opcoes.setAttribute('aria-hidden', (!ativo).toString());
            perfil.setAttribute('aria-expanded', ativo.toString());
        }

        perfil.addEventListener('click', function (ev) {
            ev.stopPropagation();
            abrirFecharPerfil();
        });

        perfil.addEventListener('keydown', function (ev) {
            if (ev.key === 'Enter' || ev.key === ' ') {
                ev.preventDefault();
                abrirFecharPerfil();
            }
        });

        document.addEventListener('click', function (ev) {
            if (!ev.target.closest('#perfilIcon') && !ev.target.closest('.opcoes-dropdown')) {
                opcoes.classList.remove('active');
                opcoes.setAttribute('aria-hidden', 'true');
                perfil.setAttribute('aria-expanded', 'false');
            }
        });
    })();

</script>
