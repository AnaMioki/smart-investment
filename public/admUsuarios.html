<script src="Style/js/fazerHamburguer.js"></script>
<script>
      if (sessionStorage.getItem('ID_USUARIO')===null) {
            showLoginCard(6);
        }

        function showLoginCard(seconds) {
            const overlay = document.createElement('div');
            overlay.className = 'login-overlay';
            overlay.innerHTML = `
                <div class="login-card">
                    <h3>É necessário fazer login</h3>
                    <p>Você precisa entrar para acessar esta página. Redirecionando em <span id="login-timer">${seconds}</span>s</p>
                    <div class="progress"><div class="progress-bar"></div></div>
                    <div class="login-actions">
                        <button id="btnLoginNow">Ir para login</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);

            const bar = overlay.querySelector('.progress-bar');
            const timerEl = overlay.querySelector('#login-timer');
            const btnNow = overlay.querySelector('#btnLoginNow');

            let remaining = seconds;
            timerEl.textContent = remaining;

            const totalMs = seconds * 1000;
            const start = Date.now();

            const interval = setInterval(() => {
                const elapsed = Date.now() - start;
                const pct = Math.min(100, (elapsed / totalMs) * 100);
                bar.style.width = pct + '%';
                const secLeft = Math.ceil((totalMs - elapsed) / 1000);
                timerEl.textContent = secLeft > 0 ? secLeft : 0;
                if (pct >= 100) {
                    clearInterval(interval);
                    window.location.href = 'login.html';
                }
            }, 100);

            btnNow.addEventListener('click', () => {
                clearInterval(interval);
                window.location.href = 'login.html';
            });

            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) {
                    clearInterval(interval);
                    overlay.remove();
                }
            });
        }
    window.onload = listarUsuarios;

    async function listarUsuarios() {
        const response = await fetch(`/usuarios/buscarUsuarios`, {
            method: "GET",
            headers: { "Content-Type": "application/json" }
        });
        const info = await response.json();

        let userListContainer = document.querySelector('.user-list');
        userListContainer.innerHTML = '';

        info.forEach(user => {
            userListContainer.innerHTML += ` <div class="user-card">
                    <div class="user-info">
                        <h2>${user.nome}</h2>
                        <p>Email: ${user.email}</p>
                    </div>
                    <div class="buttons">
                        <img src="Style/assets/trashIcon.svg" alt="" onclick="excluirUsuario(${user.idUsuario})">
                    </div>
                </div>`;
        });
    }

    async function excluirUsuario(id) {
        if (!id) return;
        await fetch(`/usuarios/excluirUsuario/${id}`, {
            method: "DELETE",
            headers: { "Content-Type": "application/json" }
        });
        listarUsuarios();
    }

    function sair() {
        window.location.href = "index.html";
    }

</script>
