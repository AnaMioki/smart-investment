    <script>
        // if (sessionStorage.PERFIL_USUARIO != "Administrador" || sessionStorage.getItem('ID_USUARIO') === null) {
        //     window.location.href = 'login.html';
        //     sessionStorage.clear;
        // }

        function showLoginCard(seconds) {
            document.body.classList.add('blurred');

            const overlay = document.createElement('div');
            overlay.className = 'login-overlay';
            overlay.innerHTML = `
                <div class="login-card">
                    <h3>É necessário fazer login</h3>
                    <p>Você precisa entrar para acessar esta página. Redirecionando em <span id="login-timer">${seconds}</span>s</p>
                    <div class="progress"><div class="progress-bar"></div></div>
                    <div class="login-actions">
                        <button id="btnLoginNow">Ir para login</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);

            const bar = overlay.querySelector('.progress-bar');
            const timerEl = overlay.querySelector('#login-timer');
            const btnNow = overlay.querySelector('#btnLoginNow');

            let remaining = seconds;
            timerEl.textContent = remaining;

            const totalMs = seconds * 1000;
            const start = Date.now();

            const interval = setInterval(() => {
                const elapsed = Date.now() - start;
                const pct = Math.min(100, (elapsed / totalMs) * 100);
                bar.style.width = pct + '%';
                const secLeft = Math.ceil((totalMs - elapsed) / 1000);
                timerEl.textContent = secLeft > 0 ? secLeft : 0;
                if (pct >= 100) {
                    clearInterval(interval);
                    window.location.href = 'login.html';
                }
            }, 100);

            btnNow.addEventListener('click', () => {
                document.body.classList.remove('blurred');
                window.location.href = 'login.html';
            });

        }

        function excluirUsuario(idUsuario) {
            fetch(`/usuarios/excluirUsuario/${idUsuario}`, {
                method: "DELETE",
                headers: { "Content-Type": "application/json" }
            })
                .then(response => {
                    if (response.ok) {
                        alert('Usuário excluído com sucesso!');
                        listarUsuarios();
                    } else {
                        alert('Erro ao excluir usuário.');
                    }
                })
                .catch(error => {
                    console.error('Erro:', error);
                    alert('Erro ao excluir usuário.');
                });
        }

        function sair() {
            sessionStorage.removeItem('ID_USUARIO');
            sessionStorage.removeItem('NOME_USUARIO');
            sessionStorage.removeItem('TIPO_USUARIO');
            window.location.href = 'index.html';
        }

        window.onload = listarUsuarios;

        async function listarUsuarios() {
            const response = await fetch(`/usuarios/buscarUsuarios`, {
                method: "GET",
                headers: { "Content-Type": "application/json" }
            });
            const info = await response.json();

            let userListContainer = document.querySelector('.user-list');
            userListContainer.innerHTML = '';

            info.forEach(user => {
                userListContainer.innerHTML += ` <div class="user-card">
                        <div class="user-info">
                            <h2>${user.nome}</h2>
                            <p>Email: ${user.email}</p>
                        </div>
                        <div class="buttons">
                            <img src="Style/assets/trashIcon.svg" alt="" onclick="excluirUsuario(${user.idUsuario})">
                        </div>
                    </div>`;
            });
        }

         (function () {
        const perfil = document.querySelector('#perfilIcon');
        const opcoes = document.querySelector('.opcoes-dropdown');

        if (!perfil || !opcoes) return;

        function abrirFecharPerfil() {
            const ativo = opcoes.classList.toggle('active');
            opcoes.setAttribute('aria-hidden', (!ativo).toString());
            perfil.setAttribute('aria-expanded', ativo.toString());
        }

        perfil.addEventListener('click', function (ev) {
            ev.stopPropagation();
            abrirFecharPerfil();
        });

        perfil.addEventListener('keydown', function (ev) {
            if (ev.key === 'Enter' || ev.key === ' ') {
                ev.preventDefault();
                abrirFecharPerfil();
            }
        });

        document.addEventListener('click', function (ev) {
            if (!ev.target.closest('#perfilIcon') && !ev.target.closest('.opcoes-dropdown')) {
                opcoes.classList.remove('active');
                opcoes.setAttribute('aria-hidden', 'true');
                perfil.setAttribute('aria-expanded', 'false');
            }
        });
    })();
    </script>
</body>
