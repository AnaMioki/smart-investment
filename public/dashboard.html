<script>
 document.addEventListener("DOMContentLoaded", carregarNotificacoes);

  async function carregarNotificacoes() {
    const idUsuario = sessionStorage.ID_USUARIO;

    if (!idUsuario) {
      console.warn("ID_USUARIO não encontrado no sessionStorage.");
      return;
    }

        fetch("/notificacoes/receberNotificacoes", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                idServer: idUsuario,
            })
        })
            .then(async res => {
                if (!res.ok) throw new Error("Erro ao buscar notificações");
                // Ler como texto e só parsear JSON se houver conteúdo
                const text = await res.text();
                if (!text) return [];
                try {
                    return JSON.parse(text);
                } catch (e) {
                    console.warn('Resposta de notificações não é JSON válido:', e);
                    return [];
                }
            })
            .then(notificacoes => {
                atualizarDropdown(notificacoes || []);
            })
            .catch(err => console.error(err));
  }

  function atualizarDropdown(notificacoes) {
    var contador = 0;

    const container = document.querySelector(".notificacao-dropdown");
    const badge = document.querySelector(".notification-badge");

    // Limpa o container (evita duplicar)
    container.innerHTML = "";
    var qtd_not = 0;

    notificacoes.forEach(not => {
      if (not.lido == 0) {
        qtd_not++;
      }
    });

        // Atualiza badge (mostra no máx. 9+). Se não houver notificações, oculta o badge.
        if (!badge) {
            // elemento não encontrado — nada a fazer
        } else if (qtd_not <= 0) {
            badge.style.display = 'none';
            badge.textContent = '';
        } else {
            badge.style.display = 'flex';
            badge.textContent = qtd_not > 9 ? '9+' : String(qtd_not);
        }

    notificacoes.forEach(not => {
      if (contador < 3) {
        const item = document.createElement("div");
        item.classList.add("notificacao-item");

        item.innerHTML = `
                        <div class="notificacao-content">
                            <div class="notificacao-title">${not.tipo}</div>
                            <div class="notificacao-text">${not.mensagem}</div>
                            <div class="notificacao-time">${formatarTempo(not.dtNotificacao)}</div>
                        </div>
                    `;

        container.appendChild(item);
        console.log(not.tipo)
      }
      contador++;
    });

    // Link para ver todas
    const link = document.createElement("a");
    link.href = "notificacoes.html";
    link.textContent = "Ver todas as notificações";
    container.appendChild(link);
  }

  function formatarTempo(dataBanco) {
    const data = new Date(dataBanco);
    const agora = new Date();

    const diffMs = agora - data;
    const diffMin = Math.floor(diffMs / 60000);
    const diffHoras = Math.floor(diffMin / 60);

    if (diffMin < 1) return "Agora mesmo";
    if (diffMin < 60) return `Há ${diffMin} minutos`;
    if (diffHoras < 24) return `Há ${diffHoras} hora${diffHoras > 1 ? "s" : ""}`;

    const diffDias = Math.floor(diffHoras / 24);
    return `Há ${diffDias} dia${diffDias > 1 ? "s" : ""}`;
  }

    function showLoginCard(seconds) {
        document.body.classList.add('blurred');

        const overlay = document.createElement('div');
        overlay.className = 'login-overlay';
        overlay.innerHTML = `
                <div class="login-card">
                    <h3>É necessário fazer login</h3>
                    <p>Você precisa entrar para acessar esta página. Redirecionando em <span id="login-timer">${seconds}</span>s</p>
                    <div class="progress"><div class="progress-bar"></div></div>
                    <div class="login-actions">
                        <button id="btnLoginNow">Ir para login</button>
                    </div>
                </div>
            `;
        document.body.appendChild(overlay);

        const bar = overlay.querySelector('.progress-bar');
        const timerEl = overlay.querySelector('#login-timer');
        const btnNow = overlay.querySelector('#btnLoginNow');

        let remaining = seconds;
        timerEl.textContent = remaining;

        const totalMs = seconds * 1000;
        const start = Date.now();

        const interval = setInterval(() => {
            const elapsed = Date.now() - start;
            const pct = Math.min(100, (elapsed / totalMs) * 100);
            bar.style.width = pct + '%';
            const secLeft = Math.ceil((totalMs - elapsed) / 1000);
            timerEl.textContent = secLeft > 0 ? secLeft : 0;
            if (pct >= 100) {
                clearInterval(interval);
                window.location.href = 'login.html';
            }
        }, 100);

        btnNow.addEventListener('click', () => {
            document.body.classList.remove('blurred');
            window.location.href = 'login.html';
        });

    }

// Variáveis globais para guardar as instâncias dos gráficos e poder destruí-las antes de atualizar
    let chartRankSetor = null;
    let chartSecundario = null;
    let chartVolatilidade = null;

    function atualizarDashboard() {
        const periodoSelecionado = document.getElementById('selectDash').value;

        fetch("/dashboard/receberDashboard", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                periodoServer: periodoSelecionado
            })
        }).then(function (resposta) {
            if (resposta.ok) {
                if (resposta.status == 204) {
                    var feed = document.getElementById("lista");
                    feed.innerHTML = "<h3>Nenhum dado encontrado para esses anos.</h3>";
                    throw "Nenhum resultado encontrado!!";
                }

                resposta.json().then(function (respostaJSON) {
                    console.log("Dados recebidos: ", JSON.stringify(respostaJSON));
                    
                    renderizarLista(respostaJSON);
                    renderizarGraficos(respostaJSON);
                });
            } else {
                throw ("Houve um erro na API!");
            }
        }).catch(function (resposta) {
            console.error(resposta);
        });
    }

    function renderizarLista(dados) {
        const listaDiv = document.getElementById('lista');
        listaDiv.innerHTML = ""; // Limpa a lista atual

        // Percorre os dados recebidos e cria os cards HTML
        // Vamos mostrar o TOP 4 na lista como no seu exemplo original
        for (let i = 0; i < 5 /*dados.length*/; i++) {
            let setor = dados[i];
            
            // Lógica simples de classificação (você pode aprimorar)
            let classificacaoTexto = "Baixa";
            let classificacaoCor = "corVermelha"; // CSS class
            
            if (setor.rentabilidade_periodo > 15) {
                classificacaoTexto = "Muito Alta";
                classificacaoCor = "verde"; // CSS class baseada no seu HTML antigo
            } else if (setor.rentabilidade_periodo > 10) {
                classificacaoTexto = "Alta";
                classificacaoCor = "azul";
            } else if (setor.rentabilidade_periodo > 5) {
                classificacaoTexto = "Média";
                classificacaoCor = "amarelo";
            }

            // HTML Template String
            listaDiv.innerHTML += `
            <div>
                <div class="numero">
                    <h2>${i + 1}</h2>
                    <div>
                        <h1>${setor.setor}</h1>
                        <p>Dados consolidados</p>
                    </div>
                </div>

                <div class="infos">
                    <div>
                        <h1>Retorno</h1>
                        <p class="corVerde">${setor.rentabilidade_periodo}%</p>
                    </div>

                    <div>
                        <h1>DRE (Médio)</h1>
                        <p>${setor.DRE}</p>
                    </div>

                    <div>
                        <h1>EBITDA (Médio)</h1>
                        <p>${setor.EBITDA}</p>
                    </div>

                    <div>
                        <h1>Volatilidade</h1>
                        <p class="corLaranja">${setor.volatilidade_periodo}%</p>
                    </div>

                    <h1 class="${classificacaoCor}">${classificacaoTexto}</h1>
                </div>
            </div>
            `;
        }
    }

    function renderizarGraficos(dados) {
        // Preparando Arrays para o ChartJS
        const labelsSetor = dados.map(item => item.setor);
        const dataRetorno = dados.map(item => item.rentabilidade_periodo);
        const dataVolatilidade = dados.map(item => item.volatilidade_periodo);

        // --- Gráfico 1: Top Retorno por Setor ---
        const ctxRank = document.getElementById('rankSetor');
        if (chartRankSetor) chartRankSetor.destroy(); // Destroi anterior para não bugar

        chartRankSetor = new Chart(ctxRank, {
            type: 'bar',
            data: {
                labels: labelsSetor.slice(0, 5), // Pega apenas os top 5
                datasets: [{
                    label: 'Retorno Médio (%)',
                    data: dataRetorno.slice(0, 5),
                    backgroundColor: ['#3B82F6', '#10B981', '#F59E0B', '#EF4444', '#8B5CF6'],
                    borderRadius: 6
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } },
                scales: { y: { beginAtZero: true } }
            }
        });

        // --- Gráfico 2: Volatilidade vs Retorno (Scatter Plot simulado com barras por enquanto) ---
        // Nota: O gráfico de linha temporal original precisaria de uma query diferente (dados por mês).
        // Aqui vou plotar Volatilidade comparada com retorno para aproveitar os dados que temos.
        const ctxSec = document.getElementById('graphSecundario');
        if (chartSecundario) chartSecundario.destroy();

        chartSecundario = new Chart(ctxSec, {
            type: 'bar',
            data: {
                labels: labelsSetor.slice(0, 5),
                datasets: [
                    {
                        label: 'Retorno (%)',
                        data: dataRetorno.slice(0, 5),
                        backgroundColor: '#10B981',
                        borderRadius: 4
                    },
                    {
                        label: 'Volatilidade (%)',
                        data: dataVolatilidade.slice(0, 5),
                        backgroundColor: '#EF4444',
                        borderRadius: 4
                    }
                ]
            },
            options: {
                responsive: true,
            }
        });

        // --- Gráfico 3: Volatilidade Horizontal ---
        const ctxVol = document.getElementById('volatilidadeVolume');
        if (chartVolatilidade) chartVolatilidade.destroy();

        chartVolatilidade = new Chart(ctxVol, {
            type: 'bar',
            data: {
                labels: labelsSetor,
                datasets: [{
                    label: 'Volatilidade do Período (%)',
                    data: dataVolatilidade,
                    backgroundColor: '#b388eb',
                    borderRadius: 6,
                    barThickness: 20,
                }]
            },
            options: {
                indexAxis: 'y', // Horizontal
                responsive: true,
            }
        });
    }

    function sair() {
        sessionStorage.clear();
        window.location.href = "./login.html";
    }
    
    // Dropdown Logic
    document.querySelector('#notificacaoIcon').addEventListener('click', function(e) {
        e.stopPropagation();
        const dropdown = document.querySelector('.notificacao-dropdown');
        dropdown.classList.toggle('active');
    });

    document.addEventListener('click', function(e) {
        const dropdown = document.querySelector('.notificacao-dropdown');
        if (!e.target.closest('.notificacao-container')) {
            dropdown.classList.remove('active');
        }
    });
