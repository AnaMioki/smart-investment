<script>
  document.addEventListener("DOMContentLoaded", carregarNotificacoes);

  async function carregarNotificacoes() {
    const idUsuario = sessionStorage.ID_USUARIO;

    if (!idUsuario) {
      console.warn("ID_USUARIO não encontrado no sessionStorage.");
      return;
    }

    fetch("/notificacoes/receberNotificacoes", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        idServer: idUsuario,
      })
    })
      .then(async res => {
        if (!res.ok) throw new Error("Erro ao buscar notificações");
        // Ler como texto e só parsear JSON se houver conteúdo
        const text = await res.text();
        if (!text) return [];
        try {
          return JSON.parse(text);
        } catch (e) {
          console.warn('Resposta de notificações não é JSON válido:', e);
          return [];
        }
      })
      .then(notificacoes => {
        atualizarDropdown(notificacoes || []);
      })
      .catch(err => console.error(err));
  }

  function atualizarDropdown(notificacoes) {
    var contador = 0;

    const container = document.querySelector(".notificacao-dropdown");
    const badge = document.querySelector(".notification-badge");

    // Limpa o container (evita duplicar)
    container.innerHTML = "";
    var qtd_not = 0;

    notificacoes.forEach(not => {
      if (not.lido == 0) {
        qtd_not++;
      }
    });

    // Atualiza badge (mostra no máx. 9+). Se não houver notificações, oculta o badge.
    if (!badge) {
      // elemento não encontrado — nada a fazer
    } else if (qtd_not <= 0) {
      badge.style.display = 'none';
      badge.textContent = '';
    } else {
      badge.style.display = 'flex';
      badge.textContent = qtd_not > 9 ? '9+' : String(qtd_not);
    }

    notificacoes.forEach(not => {
      if (contador < 3) {
        const item = document.createElement("div");
        item.classList.add("notificacao-item");

        item.innerHTML = `
                        <div class="notificacao-content">
                            <div class="notificacao-title">${not.tipo}</div>
                            <div class="notificacao-text">${not.mensagem}</div>
                            <div class="notificacao-time">${formatarTempo(not.dtNotificacao)}</div>
                        </div>
                    `;

        container.appendChild(item);
        console.log(not.tipo)
      }
      contador++;
    });

    // Link para ver todas
    const link = document.createElement("a");
    link.href = "notificacoes.html";
    link.textContent = "Ver todas as notificações";
    container.appendChild(link);
  }

  function formatarTempo(dataBanco) {
    const data = new Date(dataBanco);
    const agora = new Date();

    const diffMs = agora - data;
    const diffMin = Math.floor(diffMs / 60000);
    const diffHoras = Math.floor(diffMin / 60);

    if (diffMin < 1) return "Agora mesmo";
    if (diffMin < 60) return `Há ${diffMin} minutos`;
    if (diffHoras < 24) return `Há ${diffHoras} hora${diffHoras > 1 ? "s" : ""}`;

    const diffDias = Math.floor(diffHoras / 24);
    return `Há ${diffDias} dia${diffDias > 1 ? "s" : ""}`;
  }

  function sair() {
    sessionStorage.clear();
    window.location.href = "./login.html";
  }

  //    if (sessionStorage.getItem('ID_USUARIO') === null) {
  //      showLoginCard(4);
  //  }

  function showLoginCard(seconds) {
    document.body.classList.add('blurred');

    const overlay = document.createElement('div');
    overlay.className = 'login-overlay';
    overlay.innerHTML = `
                <div class="login-card">
                    <h3>É necessário fazer login</h3>
                    <p>Você precisa entrar para acessar esta página. Redirecionando em <span id="login-timer">${seconds}</span>s</p>
                    <div class="progress"><div class="progress-bar"></div></div>
                    <div class="login-actions">
                        <button id="btnLoginNow">Ir para login</button>
                    </div>
                </div>
            `;
    document.body.appendChild(overlay);

    const bar = overlay.querySelector('.progress-bar');
    const timerEl = overlay.querySelector('#login-timer');
    const btnNow = overlay.querySelector('#btnLoginNow');

    let remaining = seconds;
    timerEl.textContent = remaining;

    const totalMs = seconds * 1000;
    const start = Date.now();

    const interval = setInterval(() => {
      const elapsed = Date.now() - start;
      const pct = Math.min(100, (elapsed / totalMs) * 100);
      bar.style.width = pct + '%';
      const secLeft = Math.ceil((totalMs - elapsed) / 1000);
      timerEl.textContent = secLeft > 0 ? secLeft : 0;
      if (pct >= 100) {
        clearInterval(interval);
        window.location.href = 'login.html';
      }
    }, 100);

    btnNow.addEventListener('click', () => {
      document.body.classList.remove('blurred');
      window.location.href = 'login.html';
    });

  }

  //                    COMEÇANDO MINHA PARTE 

  // Variáveis globais para guardar as instâncias dos gráficos e poder destruí-las antes de atualizar
  let chartRankSetor = null;
  let chartSecundario = null;
  let chartVolatilidade = null;

  function atualizarDashboard() {
    const periodoSelecionado = document.getElementById('selectDash').value;

    fetch("/dashboard/receberDashboard", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        periodoServer: periodoSelecionado
      })
    }).then(function (resposta) {
      if (resposta.ok) {
        if (resposta.status == 204) {
          var feed = document.getElementById("lista");
          feed.innerHTML = "<h3>Nenhum dado encontrado para esses anos.</h3>";
          throw "Nenhum resultado encontrado!!";
        }

        resposta.json().then(function (respostaJSON) {
          console.log("Dados recebidos: ", JSON.stringify(respostaJSON));

          renderizarLista(respostaJSON);
          renderizarGraficos(respostaJSON);
        });
      } else {
        throw ("Houve um erro na API!");
      }
    }).catch(function (resposta) {
      console.error(resposta);
    });
  }

  function renderizarLista(dados) {
    const listaDiv = document.getElementById('lista');
    listaDiv.innerHTML = ""; // Limpa a lista atual

    // 1. Pega o período selecionado no <select>
    const periodoSelecionado = document.getElementById('selectDash').value;
    
    // 2. Calcula o Benchmark (IBOVESPA) para esse período
    // O retorno é string, então usamos parseFloat para fazer as contas de comparação depois
    const benchmarkString = getBenchmarkIbovespa(periodoSelecionado);
    const benchmarkValor = parseFloat(benchmarkString);

    // Ordena os dados para garantir que a lista mostre os melhores primeiro (opcional, mas recomendado)
    // Se seus dados já vêm ordenados do back-end, pode remover o .sort()
    const dadosOrdenados = dados.sort((a, b) => b.rentabilidade_periodo - a.rentabilidade_periodo);

    // Loop para exibir o TOP 5
    // Verifica se existem dados suficientes para não quebrar o loop
    const limite = Math.min(dadosOrdenados.length, 5); 

    for (let i = 0; i < 5; i++) {
        let setor = dadosOrdenados[i];
        let rentabilidadeSetor = setor.rentabilidade_periodo;

        // --- Lógica de Classificação Dinâmica ---
        let classificacaoTexto = "";
        let classificacaoCor = ""; 

        // Regra: Muito alta > IBOVESPA + 6.2
        if (rentabilidadeSetor > (benchmarkValor + 6.2)) {
            classificacaoTexto = "Muito Alta";
            classificacaoCor = "verde"; // Classe CSS
        } 
        // Regra: Alta entre (IBOVESPA + 3.1) e (IBOVESPA + 6.2)
        else if (rentabilidadeSetor >= (benchmarkValor + 3.1)) {
            classificacaoTexto = "Alta";
            classificacaoCor = "azul";
        }
        // Regra: Média entre (IBOVESPA - 3) e (IBOVESPA + 3) 
        // Nota: Ajustei o limite superior para < 3.1 para não conflitar com a Alta
        else if (rentabilidadeSetor >= (benchmarkValor - 3)) {
            classificacaoTexto = "Média";
            classificacaoCor = "amarelo";
        }
        // Regra: Baixa < IBOVESPA - 3
        else {
            classificacaoTexto = "Baixa";
            classificacaoCor = "corVermelha";
        }

        // --- HTML Template ---
        listaDiv.innerHTML += `
            <div>
                <div class="numero">
                    <h2>${i + 1}</h2>
                    <div>
                        <h1>${setor.setor}</h1>
                    </div>
                </div>

                <div class="infos">
                    <div>
                        <h1>Rentabilidade</h1>
                        <p class="corVerde">${setor.rentabilidade_periodo}%</p>
                    </div>

                    <div>
                        <h1>Rentabilidade (IBOVESPA)</h1>
                        <p>${benchmarkString}%</p>
                    </div>

                    <div>
                        <h1>DRE (Médio R$M)</h1>
                        <p>${setor.DRE}</p>
                    </div>

                    <div>
                        <h1>EBITDA (Médio R$M)</h1>
                        <p>${setor.EBITDA}</p>
                    </div>

                    <div>
                        <h1>Volatilidade</h1>
                        <p class="corLaranja">${setor.volatilidade_periodo}%</p>
                    </div>

                    <div>
                        <h1>Retorno diante do IBOVESPA</h1>
                        <p class="${classificacaoCor}">${classificacaoTexto}</p>
                    </div>
                </div>
            </div>
            `;
    }
}

// Função auxiliar para pegar a média do Ibovespa conforme o filtro selecionado
function getBenchmarkIbovespa(periodo) {
    
    let benchmark = 0;
    
    // Parse para garantir que é número
    const p = parseInt(periodo);

    switch(p) {
        case 1: // Somente 2024
            benchmark = -10.36; 
            break;
        case 2: // Média 2023-2024
            benchmark = (22.28 - 10.36) / 2; // ~ 5.96%
            break;
        case 3: // Média 2022-2024
            benchmark = (4.69 + 22.28 - 10.36) / 3; // ~ 5.53%
            break;
        case 4: // Média 2021-2024
            benchmark = (-11.93 + 4.69 + 22.28 - 10.36) / 4; // ~ 1.17%
            break;
        case 5: // Média 2020-2024
            benchmark = (2.92 - 11.93 + 4.69 + 22.28 - 10.36) / 5; // ~ 1.52%
            break;
        default:
            benchmark = 5.0; 
    }
    
    return benchmark.toFixed(2); 
}


function renderizarGraficos(dados) {
    Chart.defaults.font.size = 22; 
    Chart.defaults.font.weight = 'bold';
    Chart.defaults.color = '#000000';
    const periodoSelecionado = document.getElementById('selectDash').value;
    const valorBenchmark = getBenchmarkIbovespa(periodoSelecionado);

    // Ordena por rentabilidade (maior para menor) e pega o TOP 5
    // Isso garante que todos os gráficos falem dos mesmos "campeões"
    const top5 = dados
        .sort((a, b) => b.rentabilidade_periodo - a.rentabilidade_periodo)
        .slice(0, 5);
        
    const labelsTop5 = top5.map(d => d.setor);

    // --- GRÁFICO 1: PERFORMANCE RELATIVA (Setor vs Ibovespa) ---
    const ctxRank = document.getElementById('rankSetor');
    if (chartRankSetor) chartRankSetor.destroy();

    chartRankSetor = new Chart(ctxRank, {
        type: 'bar',
        data: {
            labels: labelsTop5,
            datasets: [
                {
                    label: 'Média Ibovespa',
                    // Cria uma linha reta repetindo o valor do benchmark para cada coluna
                    data: Array(5).fill(valorBenchmark),
                    type: 'line', // Transforma este dataset em linha
                    borderColor: '#6B7280', // Cinza escuro
                    borderWidth: 2,
                    borderDash: [5, 5], // Linha pontilhada
                    pointRadius: 0,
                    order: 0 // Garante que a linha fique por cima
                },
                {
                    label: 'Rentabilidade do Setor (%)',
                    data: top5.map(d => d.rentabilidade_periodo),
                    // Pinta de Verde se venceu o Benchmark, Azul se perdeu (ou vice-versa, conforme sua regra)
                    backgroundColor: top5.map(d => d.rentabilidade_periodo >= valorBenchmark ? '#10B981' : '#3B82F6'),
                    borderRadius: 4,
                    order: 1
                }
            ]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { display: true, position: 'top' }, // Mostra legenda para identificar a linha
                tooltip: {
                    callbacks: {
                        footer: (tooltipItems) => {
                            let val = tooltipItems[0].raw;
                            let diff = (val - valorBenchmark).toFixed(2);
                            if(tooltipItems[0].dataset.type === 'line') return '';
                            return `Diferença pro Ibov: ${diff > 0 ? '+' : ''}${diff}%`;
                        }
                    }
                }
            },
            scales: {
                x: { 
                    title: { display: true, text: 'TOP 5 Setores' },
                    // Ajuste dinâmico: começa do 0 ou do menor valor para dar destaque
                    suggestedMin: 0 
                },
                y: { 
                    title: { display: true, text: 'Rentabilidade (%)' },
                    // Adiciona a linha de grade do Benchmark visualmente (zero line ou similar) se desejar
                }
            }
        }
    });

    // --- GRÁFICO 2: MAPA DE EFICIÊNCIA (Risco x Retorno) - APENAS TOP 5 ---
    const ctxSec = document.getElementById('graphSecundario');
    if (chartSecundario) chartSecundario.destroy();

    chartSecundario = new Chart(ctxSec, {
        type: 'scatter',
        data: {
            datasets: [{
                label: 'Setores Top 5',
                data: top5.map(item => ({
                    x: item.volatilidade_periodo, // Risco
                    y: item.rentabilidade_periodo, // Retorno
                    setor: item.setor
                })),
                backgroundColor: '#8B5CF6', // Roxo
                pointRadius: 8, // Pontos maiores já que são poucos
                pointHoverRadius: 10
            }]
        },
        options: {
            responsive: true,
            plugins: {
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            let p = context.raw;
                            return `${p.setor}: Rentabilidade ${p.y}% | Risco ${p.x}%`;
                        }
                    }
                },
                annotation: {
                    // Opcional: Se quiser desenhar uma linha horizontal marcando o Ibovespa neste gráfico também
                    // Requereria plugin externo, então vamos manter simples por enquanto.
                }
            },
            scales: {
                x: { 
                    title: { display: true, text: 'Risco (Volatilidade %)' },
                    // Ajuste dinâmico: começa do 0 ou do menor valor para dar destaque
                    suggestedMin: 0 
                },
                y: { 
                    title: { display: true, text: 'Rentabilidade (%)' },
                    // Adiciona a linha de grade do Benchmark visualmente (zero line ou similar) se desejar
                }
            }
        }
    });

    // --- GRÁFICO 3: FUNDAMENTOS (DRE vs EBITDA) ---
    const ctxVol = document.getElementById('volatilidadeVolume');
    if (chartVolatilidade) chartVolatilidade.destroy();

    const limparValor = (val) => {
        if(typeof val === 'number') return val;
        return parseFloat(String(val).replace(/[^0-9.-]/g, '')); 
    };

    chartVolatilidade = new Chart(ctxVol, {
        type: 'bar',
        data: {
            labels: labelsTop5,
            datasets: [
                {
                    label: 'EBITDA (Caixa)',
                    data: top5.map(d => limparValor(d.EBITDA)),
                    backgroundColor: '#F59E0B', // Laranja
                    borderRadius: 4,
                    barPercentage: 0.6,
                },
                {
                    label: 'Lucro Líquido (DRE)',
                    data: top5.map(d => limparValor(d.DRE)),
                    backgroundColor: '#10B981', // Verde
                    borderRadius: 4,
                    barPercentage: 0.6,
                }
            ]
        },
        options: {
            indexAxis: 'y', // Gráfico Horizontal
            responsive: true,
            scales: {
                x: {
                    grid: { display: true },
                    title: { display: true, text: 'R$(M)' },
                    suggestedMin: 0 
                }
            }
        }
    });
}

  
  function sair() {
    sessionStorage.clear();
    window.location.href = "./login.html";
  }

  // Dropdown Logic
  document.querySelector('#notificacaoIcon').addEventListener('click', function (e) {
    e.stopPropagation();
    const dropdown = document.querySelector('.notificacao-dropdown');
    dropdown.classList.toggle('active');
  });

  document.addEventListener('click', function (e) {
    const dropdown = document.querySelector('.notificacao-dropdown');
    if (!e.target.closest('.notificacao-container')) {
      dropdown.classList.remove('active');
    }
  });


  (function () {
    const perfil = document.querySelector('#perfilIcon');
    const opcoes = document.querySelector('.opcoes-dropdown');

    if (!perfil || !opcoes) return;

    function abrirFecharPerfil() {
      const ativo = opcoes.classList.toggle('active');
      opcoes.setAttribute('aria-hidden', (!ativo).toString());
      perfil.setAttribute('aria-expanded', ativo.toString());
    }

    perfil.addEventListener('click', function (ev) {
      ev.stopPropagation();
      abrirFecharPerfil();
    });

    perfil.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' || ev.key === ' ') {
        ev.preventDefault();
        abrirFecharPerfil();
      }
    });

    document.addEventListener('click', function (ev) {
      if (!ev.target.closest('#perfilIcon') && !ev.target.closest('.opcoes-dropdown')) {
        opcoes.classList.remove('active');
        opcoes.setAttribute('aria-hidden', 'true');
        perfil.setAttribute('aria-expanded', 'false');
      }
    });
  })();

</script>
